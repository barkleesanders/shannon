name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: if ! which tmux; then sudo apt-get update && sudo apt-get install -y tmux; fi
      - run: bun install --frozen-lockfile
      - run: bun add -g @anthropic-ai/claude-code
      - run: bun test
      - run: SHANNON_FAKE_TMUX=1 bun test src/test/learning/shannon-transcript.test.ts
      - run: bun run typecheck
      - run: bun pm pack --dry-run
      - run: cd packages/shannon-agent-sdk && bun pm pack --dry-run
